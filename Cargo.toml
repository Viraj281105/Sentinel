[workspace]
resolver = "3"
members = ["crates/sentinel-safety", "crates/sentinel-classify", "crates/sentinel-scanner", "crates/sentinel-store", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
