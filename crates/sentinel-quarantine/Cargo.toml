[package]
name = "sentinel-quarantine"
description = "Quarantine executor for Sentinel: move, restore and expire cleaned items"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sentinel-cleanup = { path = "../sentinel-cleanup" }
sentinel-safety = { path = "../sentinel-safety" }
sentinel-store = { path = "../sentinel-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = "11"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Storage_FileSystem"]

[dev-dependencies]
tempfile = "3"
