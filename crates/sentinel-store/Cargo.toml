[package]
name = "sentinel-store"
description = "Local SQLite persistence for Sentinel (scan results and storage history)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
sentinel-scanner = { path = "../sentinel-scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
ts-rs = "11"

[dev-dependencies]
tempfile = "3"
