[package]
name = "sentinel-safety"
description = "Path canonicalization, protected-path policy and validated cleanup targets for Sentinel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
]

[dev-dependencies]
tempfile = "3"
