[package]
name = "sentinel-devenv"
description = "Read-only detection of development projects, runtimes and rebuildable artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sentinel-scanner = { path = "../sentinel-scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
ts-rs = "11"

[dev-dependencies]
tempfile = "3"
