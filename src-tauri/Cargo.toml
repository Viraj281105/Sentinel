[package]
name = "sentinel-app"
description = "Sentinel desktop application (Tauri shell and IPC layer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sentinel-classify = { path = "../crates/sentinel-classify" }
sentinel-devenv = { path = "../crates/sentinel-devenv" }
sentinel-quarantine = { path = "../crates/sentinel-quarantine" }
sentinel-cleanup = { path = "../crates/sentinel-cleanup" }
sentinel-safety = { path = "../crates/sentinel-safety" }
sentinel-scanner = { path = "../crates/sentinel-scanner" }
sentinel-store = { path = "../crates/sentinel-store" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs = "11"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_System_WindowsProgramming"]

[dev-dependencies]
tempfile = "3"
