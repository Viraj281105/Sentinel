[package]
name = "sentinel-app"
description = "Sentinel desktop application (Tauri shell and IPC layer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sentinel-safety = { path = "../crates/sentinel-safety" }
sentinel-scanner = { path = "../crates/sentinel-scanner" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs = "11"
